[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supergit-tools-backend"
version = "4.0.0"
description = "Backend for SuperGit-Tools - async git operations"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "SuperGit-Tools", email = "info@supergit.local"}]
keywords = ["git", "sync", "async", "utilities"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]

[project.scripts]
supergit-backend = "supergit_backend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/supergit_backend"]
